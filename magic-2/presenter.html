<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>講者視窗｜逐頁講稿</title><style>*{box-sizing:border-box}body{margin:0;background:#172725;color:#f7f4ed;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.8}main{max-width:1000px;margin:auto;padding:28px}header{position:sticky;top:0;background:#172725f5;padding:14px 0;border-bottom:1px solid #ffffff30;z-index:2}button,select{font:inherit;font-size:15px;padding:8px 12px;background:#253b34;color:#fff;border:1px solid #61766a;border-radius:5px;margin:4px 5px 4px 0}select{max-width:100%}h1{font-size:32px;line-height:1.4}h2{color:#d9f78b;font-size:17px;margin:0 0 12px}section{border-bottom:1px solid #ffffff25;padding:22px 0}p{margin:0;white-space:pre-line}#script{font-size:22px;line-height:1.85}#script .pace{font-size:17px;background:#263c34;padding:16px;margin-top:10px}a{color:#d9f78b}small{font-size:14px;color:#bdd0c2}.warning{background:#d9f78b;color:#172725;padding:12px 16px}#timer{font:28px ui-monospace,monospace}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:4px}.source{font-size:16px}#status{font-size:13px;color:#bdd0c2}</style><main><div class="warning">講者專用，含案例答案。請把此視窗留在個人螢幕，投影主簡報。</div><header><div id="status">獨立閱讀模式：可選頁備課；從簡報開啟時會同步。</div><div class="controls"><select id="pages" aria-label="選擇講稿頁數"></select><button id="smaller">字體－</button><button id="larger">字體＋</button></div><div id="timing"></div><div class="controls"><button id="prev">← 上一頁</button><button id="next">下一步 →</button><span id="timer">—</span><button id="toggle">開始／暫停倒數</button><button id="reset">重設倒數</button></div></header><h1 id="title"></h1><small>方括號為操作提示，不必念出；備用接話依現場選用。</small><div id="script"></div><section><h2>互動提問</h2><p id="question"></p></section><section><h2>原始資料與影片</h2><div id="sources" class="source"></div></section><section><h2>下一頁</h2><p id="nextTitle"></p></section></main><script>
const D={"slides": [{"title": "全班都說會買，\n你敢先墊錢嗎？", "mins": 1, "question": "願意先墊錢的舉手；還不願意的，你在等什麼？", "script": {"opening": "先不要急著想創業。我想請你們做一個很實際的決定：你是社團周邊的負責人，大家都說這件 T-shirt 好看，廠商今天要收訂金。要先用你的錢墊，你答應嗎？", "explain": "這不是考試，也沒有現在就要猜中的答案。想像錢真的從你的帳戶出去，大家最後沒買，衣服和帳單都留在你手上。", "ask": "願意先墊的舉手。好，先放下。還不願意的舉手。還沒決定也可以。請一位同學用一句話說，你現在最擔心什麼。", "responses": "【沒人回答】先不用解釋，只要選願意或不願意。我給你們五秒。\n【有人說相信朋友】你相信的是他喜歡，還是他最後會付款？先把這個差別記住。\n【有人要先收錢】這是一個做法，先留著，等一下我們看它想解決什麼問題。", "wrap": "我不急著公布答案。先記住你剛剛站在哪一邊。", "transition": "先保留你的選擇。我們來看，群組接下來會怎麼回。", "pace": "本頁 1 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "群組裡的「＋1」，\n真的算一張訂單嗎？", "mins": 2, "question": "剛剛願意墊錢的人，現在會改變決定嗎？為什麼？", "script": {"opening": "剛剛你做了選擇。現在看看，同一個社團群組裡，接著發生什麼事。", "explain": "【按下一句】大家說好看，也喊了＋1。如果你是負責人，這時候是不是會有點安心？\n【再按下一句】現在公布一件 690 元，今晚收款。先不要看下一句，你猜大家會怎麼回？\n【最後一句】有人說再問朋友、晚點回。這是課堂模擬，但這種感覺應該很熟悉。", "ask": "跟旁邊的人聊三十秒：剛剛願意墊錢的，現在有沒有改變？讓一位改變、一位沒改變的同學各講一句理由。", "responses": "【說朋友不守信用】也可能是喜歡但預算不夠，或還不知道尺寸。我們先別急著判斷人品。\n【沒人接話】你有沒有按過喜歡，最後卻沒買？用自己的經驗想就好。", "wrap": "同一句我想要，可能包含不同程度的投入。我們需要看到後面實際發生的事。", "transition": "一句＋1和真的付款，中間會發生什麼？我們把同一件 T-shirt 的反應記下來。", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "同一件 T-shirt，\n最後只有 3 人付款", "mins": 3, "question": "現在還要墊錢嗎？先選一個下一步，記下你的理由。", "script": {"opening": "還是同一件 T-shirt。假設最後有一百人喊＋1，二十人填尺寸，只有三人付款。你現在怎麼辦？", "explain": "這組數字是課堂模擬。先不要把三個人解讀成成功或失敗。你還不知道他們為什麼買，也不知道其他人為什麼沒買。", "ask": "請先自己選畫面上一個下一步，寫下選項和一句理由。給大家三十秒。再請兩位選不同選項的同學說明。這個選擇等一下會回來，請留著。", "responses": "【選找更多人】你認為問題主要是人數不夠，對嗎？什麼資訊會支持這個判斷？\n【選改款式】你有看到款式造成沒付款的證據嗎？\n【沒人回答】不用選最聰明的，選你下週真的最想做的那一件事。", "wrap": "先保留這些理由。今天我們會練習的，就是資訊不完整時，怎麼選下一步。", "transition": "先記住你的選擇。你剛才已經在做創業決策了：證據不完整，錢卻要先花出去。", "pace": "本頁 3 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "如果花的是你的錢，\n你還會一樣決定嗎？", "mins": 2, "question": "資訊還不完整時，你會靠什麼決定下一步？", "script": {"opening": "你們剛才已經在做一件創辦人每天都會做的事：資訊還不完整，但投入的決定不能一直等。", "explain": "剛剛是一筆訂金。接下來，可能是你一個月的時間、存款，還有夥伴的心力。今天有三個不同公司的真實故事。我會停在他們還不知道結果的那一刻，先換你決定，討論完再看真實做法。", "ask": "請和鄰座三到四人一組，不用搬桌椅。每次先自己選，再交換理由。我想聽的是你根據什麼，而不是誰最快猜中公司。", "responses": "【有人知道案例】先幫我保密。你可以挑戰大家的理由，但先不要公布結局。\n【學生問標準答案】我們會看當事人做了什麼，但他做過不代表任何情境都必須照做。", "wrap": "第一個問題是：大家都說想用，這樣就夠開始了嗎？", "transition": "接下來的三個故事互相獨立，但問題會往前走：要不要開始、先服務誰、還要不要繼續。每次先自己選、再討論、最後看真實做法。第一個故事，從社團小編熟悉的麻煩開始。", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "身為社團小編的你", "mins": 2, "question": "當小編最麻煩的，是寫內容，還是記得準時發？", "script": {"opening": "第一個故事，先用社團小編的日常帶你們進去。這段是依真實需求改編的校園情境，不是當年的歷史影像。", "explain": "【播放 24 秒情境短片，先不說公司名稱】想像你明天要交報告，今晚還得記得發社團貼文。你想到一個能準時自動發文的工具，朋友說一定用。", "ask": "當小編最麻煩的是什麼？寫內容、記得時間，還是兩個都有？請一位做過小編的同學分享；沒做過，也可以想想定時交作業的經驗。", "responses": "【說已經有這種工具】對，今天我們回到它還沒做出來、創辦人還不知道會不會有人用的時刻。\n【沒人回答】假設你怕忘記，會設鬧鐘嗎？這個工具要幫你省下哪個動作？", "wrap": "有一個自己感受得到的麻煩，是起點。接下來還要看別人願不願意採取行動。", "transition": "真實創辦人也想解決貼文排程。他沒有只停在朋友說好，而是先放了一個介紹頁。我們看這一步得到什麼。", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}, "source": null}, {"title": "有人留下 Email。\n現在可以開始做了嗎？", "mins": 2, "question": "留下聯絡方式，證明了什麼？還可能只是什麼？", "script": {"opening": "朋友說想用之後，他先做了一個產品介紹頁。產品還沒完成，但有些人留下 Email，想知道何時上線。", "explain": "右邊是教學示意，不是歷史網頁截圖。現在我們確定看到的是留下聯絡方式。至於為什麼留下、之後會不會使用，還要再確認。", "ask": "留下 Email 證明了什麼？請給我一種樂觀解釋，再給我一種其他可能。", "responses": "【說有人需要所以成功】這是可能的解釋。還有沒有只是好奇、支持朋友，或想免費試看的可能？\n【說什麼都沒證明】它至少表示對方願意多走一步。只是這一步能回答的問題有限。\n【沉默】如果你登記遊戲上市通知，你一定會買嗎？", "wrap": "我們把觀察和猜測分開：登記是觀察，願意一直用或付錢，目前仍是推論。", "transition": "現在知道有人願意留下 Email。這樣的資訊，夠不夠讓你投入下一個月？", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "你願意押上\n下一個月嗎？", "mins": 1, "question": "你最想降低哪一種風險？", "script": {"opening": "現在換你管這個團隊。假設兩個人、一個月，只能專心做一件事，你選哪一個？", "explain": "這是我們為討論設定的資源限制，不是創辦人當年的精確人數或工期。每個選項都會花資源，也都想降低不同的風險。", "ask": "先不要和組員說話。用三十秒寫一個選項，再寫：我最怕的是什麼。也可以寫其他做法。", "responses": "【有人問哪個比較好】先告訴我你最怕產品做不出來、沒人來，還是沒人願意付出？你的優先風險會影響選擇。\n【學生想全部做】現在只選第一步，後面可以接著做。", "wrap": "接下來小組要交換的，不只是選項，而是每個人最想確認的事。", "transition": "先把選項留著。接下來，請小組說清楚：你們的選擇靠的是哪個證據？", "pace": "本頁 1 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "你們還需要\n哪個證據？", "mins": 7, "timer": 240, "question": "實驗結果很好，會支持什麼？什麼仍然不知道？", "script": {"opening": "請把剛才的個人選擇帶進小組。這四句話，就是你們等一下分享的骨架。", "explain": "先說我們選什麼，再說現在只知道什麼、還不知道什麼，最後說下一步要看什麼。請說到能觀察的動作，例如登記、實際使用或付款，不只說看看反應。", "ask": "【啟動四分鐘倒數】前兩分鐘每人講理由，後兩分鐘整理成一個做法。結束後請兩組各用一分鐘分享，我再追問一分鐘。", "responses": "【巡組卡住】先把目前已經發生的事寫下來，哪些只是你們猜的？\n【分享太抽象】你說反應不錯，具體會看到哪一個動作？\n【某人包辦】請還沒說話的同學補一個可能失敗的原因。", "wrap": "謝謝。你們提出的是不同的驗證路線。先不評誰猜中，現在看真實創辦人的下一步。", "transition": "你們已經提出判斷和缺少的資訊。現在看看，真實創辦人下一步做了什麼。", "pace": "本頁 7 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "揭曉：他多放了\n一頁價格", "mins": 4, "reveal": true, "source": "buffer", "question": "有人點付費方案，上線卻沒付錢，可能是什麼原因？", "script": {"opening": "剛才每一組都有自己的選擇。現在先不急著背答案，我們來看當事人留下的畫面。請先安靜看五秒，告訴我你看到什麼。", "explain": "[第 1 幕｜先看畫面。他讓人做了什麼？]\n這是創辦人公開的早期測試流程。\n先看上半部，再沿著箭頭往下看。\n問大家：「你看到的是已經能用的產品，還是一個測試？」\n[收兩個回答，再按 → 前進。]\n\n[第 2 幕｜下一次，他多放了一道選擇。]\nFree $0／Standard $5／Max $20\n讓有興趣的人先面對價格。\n問大家：「多了價格頁，能幫他少猜哪一件事？」\n[收兩個回答，再按 → 前進。]\n\n[第 3 幕｜點了方案，還不等於付錢。]\n先觀察興趣與方案點擊，再推出可用產品。\n上線後四天內，才迎來第一位付費客戶。\n問大家：「如果只看到有人點付費方案，你敢說「已經有人買」嗎？」\n[收兩個回答，再按 → 前進。]\n\n他先用介紹頁看興趣，接著加上價格方案，觀察有人是否仍願意往下走，之後才做出可用產品並獲得付費顧客。請注意，點選價格方案還不是付款。這幾個階段提供的資訊不同。", "ask": "你們哪一組也想先看價格反應？你們想知道的，和他一樣嗎？再問大家：點過付費方案的人，為什麼最後可能沒買？", "responses": "【有人說已完全驗證】先縮小結論：當時多知道了價格反應，還沒知道長期使用或續購。\n【有人選先做產品而懊惱】選項不一樣沒關係，重點是你的做法會取得什麼證據，代價又是多少。\n【想補原始材料】本頁保留 Buffer 創辦人原始文章。找到的完整訪談需付費，沒有放入無法直接播放的影片；請依畫面三步流程講述。", "wrap": "這一頁的重點，是每做一步，都增加一點能用來決定下一步的資訊。", "transition": "他一步一步觀察不同的行為。這些行為各自能回答什麼問題？", "pace": "本頁維持 4 分鐘，分三幕。方向鍵 → 逐幕展開，← 回看上一幕。先留 5 秒讓學生看原圖，再提問。原圖可點選放大；不要逐字翻譯英文介面。"}, "revealScenes": [{"image": "buffer-first", "title": "先看畫面。\n他讓人做了什麼？", "caption": "這是創辦人公開的早期測試流程。\n先看上半部，再沿著箭頭往下看。", "question": "你看到的是已經能用的產品，還是一個測試？", "credit": "原始截圖：Joel Gascoigne／Buffer"}, {"image": "buffer-price", "title": "下一次，\n他多放了一道選擇。", "caption": "Free $0／Standard $5／Max $20\n讓有興趣的人先面對價格。", "question": "多了價格頁，能幫他少猜哪一件事？", "credit": "原始截圖：Joel Gascoigne／Buffer"}, {"image": "buffer-price", "title": "點了方案，\n還不等於付錢。", "caption": "先觀察興趣與方案點擊，再推出可用產品。\n上線後四天內，才迎來第一位付費客戶。", "question": "如果只看到有人點付費方案，你敢說「已經有人買」嗎？", "credit": "原始截圖：Joel Gascoigne／Buffer"}]}, {"title": "每一種行為，\n回答不同的問題", "mins": 3, "question": "想知道大家會不會再買，第一次付款夠不夠？", "script": {"opening": "剛才的故事可以整理成一個很簡單的習慣：先問自己，這個行為到底回答哪個問題。", "explain": "說喜歡是好感；留聯絡方式代表願意了解；開始使用讓我們看到是否真的開始；付款是這一次願意付出；再次購買才又多了一種持續需要的訊號。順序不一定固定，有些服務會先收費。", "ask": "如果我要知道大家下次還會不會買，只看第一次付款夠不夠？請說一個可能不會再買的原因。", "responses": "【說第一次買就代表忠誠】也可能是嘗鮮、折扣或送禮。要判斷再買，就觀察下一次的選擇。\n【太抽象】想想社團活動：說會來、填表、當天真的出現，是不是不同？", "wrap": "先把問題說清楚，再找對應的行為。不要拿比較容易取得的數字，代替真正要知道的事。", "transition": "帶著這個區分，換成一個你可能真的會做的校園服務：履歷健檢。", "pace": "本頁 3 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "換你試：履歷健檢，\n怎樣才算有人需要？", "mins": 3, "question": "交履歷、預約、完成服務、付款，哪個對應你的問題？", "script": {"opening": "換成你可能真的會做的校園服務：幫同學做履歷健檢。朋友都說需要，然後呢？", "explain": "這是練習，不是真實企業案例。交出履歷、預約、完成服務、付款，分別需要不同程度的投入。你要先選一個想確認的問題，再決定觀察哪個動作。", "ask": "和鄰座用一分鐘討論：你們現在最不確定什麼？要請對方做哪個動作？我會請兩組各說一句。", "responses": "【只說問卷】問卷想問什麼？它能知道想法，但若你想看對方會不會預約，就還要設計預約這一步。\n【直接想收費】可以，但要清楚說明服務、時間與價格，不要讓人誤會已經能交付。", "wrap": "先把你們的履歷健檢點子留著。後面我們會繼續用它練習。", "transition": "你已經練習怎麼確認需求。下一個難題是：開始有人用之後，每個人想要的卻不一樣。第二個真實故事是一款 Email 工具。", "pace": "本頁 3 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "每個人都想改一點", "mins": 2, "question": "做分組作業時，有沒有遇過每個人都想改不同的地方？", "script": {"opening": "上一個故事在問需求證據夠不夠。下一個困難是：真的開始有人用之後，每個人的意見卻不一樣。", "explain": "第二個真實案例是一款處理 Email 的工具。畫面中的學生與對話是教學改編。先看短片，想想團隊一個月只能完成一件事，該怎麼辦。\n【播放 24 秒短片】", "ask": "做分組作業時，有沒有遇過每個人都想改不同地方？如果每個意見都照做，最後會怎樣？", "responses": "【說看誰聲音大】這很常發生。但聲音最大的人，是否也遇到最重要的問題？\n【沒人回應】一個想改排版、一個想加資料、一個只想趕快交，你會先處理哪個？", "wrap": "先不要急著排功能。我們先看提出需求的，是什麼樣的人。", "transition": "先不急著改產品。我們把剛剛的三種意見，放回提出意見的人身上。", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}, "source": null}, {"title": "這三個人，\n你先幫誰？", "mins": 2, "question": "除了提出的功能，你還想知道他們的什麼事？", "script": {"opening": "把剛才三種意見放回人身上：小安天天用，小宇偶爾用，小晴還沒開始用。", "explain": "三個人物都是課堂模擬。每個人提出的要求都可能合理，但我們還不知道他們在完成什麼任務，也不知道這件事對他們有多重要。", "ask": "除了他想要的功能，你最想再問他哪一件事？請不要問你喜不喜歡，試著問實際發生過的經驗。", "responses": "【選小安因為用最多】這是一條線索。你還要知道他用來做什麼，以及不夠快會造成什麼影響。\n【說小晴不付錢不用理】先別這麼快。要看團隊現在想服務誰、靠什麼創造價值。\n【沉默】可以從你上次什麼時候遇到這個問題開始問。", "wrap": "需求不能只看文字，還要看提出它的人、情境和後果。", "transition": "三種需求都有道理，但資源只能做一件事。你會把哪一種結果放在前面？", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "下一個月，\n只能完成一件事", "mins": 1, "question": "你期待改善的是註冊、持續使用，還是付費？", "script": {"opening": "你現在多知道一點使用者背景了。下一個月仍然只能做一件事，你選哪個？", "explain": "選之前先問自己，你期待改善的是更多人註冊、讓既有使用者留下，還是更願意付費？不同目標，可能導向不同選擇。", "ask": "三十秒，寫下選項和你期待改善的結果。這一次，別只寫比較重要，要寫對誰、重要在哪裡。", "responses": "【想先補資訊】可以，請說你會找誰、問什麼，補完之後怎麼決定。\n【覺得全部都重要】都重要不代表都能同時做。我們先排序這一個月。", "wrap": "現在請帶著目標和選項，進入小組取捨。", "transition": "現在把個人選擇帶進小組，說清楚先幫誰，以及這次暫時放下誰。", "pace": "本頁 1 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "你們選了誰，\n也暫時放下了誰？", "mins": 7, "timer": 240, "question": "很多人提，但很少真的遇到的問題，還要先做嗎？", "script": {"opening": "這次請你們不只說先做什麼，也說這次暫時不做什麼。取捨要讓夥伴聽得懂。", "explain": "畫面上四句，依序是服務對象、具體問題、先不處理的事、願意接受的代價。請把代價講出來，例如可能暫時少一些新註冊。", "ask": "【四分鐘討論】兩組分享時，一組說自己最有把握的理由，另一組提出一個不同角度。最後我會問：什麼資訊會讓你們改選？", "responses": "【大家想妥協成全做】想像你真的只有一個月，誰負責交付？請選第一順位。\n【需求很多人提】很多人提，是天天被卡住，還是偶爾覺得有也不錯？\n【意見衝突】先確認你們是不是在追不同目標。", "wrap": "先把取捨留在紙上。我們來看真實團隊怎麼找出最需要產品的人。", "transition": "有了你們的取捨，再來看真實團隊怎麼找出最需要產品的人。", "pace": "本頁 7 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "揭曉：先找出\n最需要產品的人", "mins": 4, "reveal": true, "source": "superhuman", "question": "問從沒用過的人，和問真正用過的人，有差嗎？", "script": {"opening": "剛才每一組都有自己的選擇。現在先不急著背答案，我們來看當事人留下的畫面。請先安靜看五秒，告訴我你看到什麼。", "explain": "[第 1 幕｜做了兩年，他仍不確定夠不夠好。]\nRahul Vohra · Superhuman 創辦人\n已有測試使用者，卻還不敢全面推出。\n問大家：「如果你是他，要靠什麼判斷可以往前走？」\n[收兩個回答，再按 → 前進。]\n\n[第 2 幕｜「不能再用，你會多失望？」]\n這次調查：22% 非常失望／52% 有點失望\n26% 不失望。這是當時的使用者回覆。\n問大家：「你會先找哪一群人聊？想知道什麼？」\n[收兩個回答，再按 → 前進。]\n\n[第 3 幕｜看見大家想要的，也看見誰最需要。]\n核心支持者反覆提到：速度、鍵盤、快捷鍵。\n先理解他們珍惜什麼，再聚焦改善方向。\n問大家：「如果把所有意見平均處理，會不會磨掉最有價值的特色？」\n[收兩個回答，再按 → 前進。]\n\n團隊向已經體驗產品的人提問，了解失去產品時的感受，再分析不同使用者看重的價值與阻礙。這是幫助取捨的線索，還需要配合實際使用情況。", "ask": "先想一個你天天用的工具：如果明天不能用，你是真的被卡住，還是有點可惜而已？兩者有什麼不同？", "responses": "【把調查比例當及格線】這不是保證成功的考試。調查對象和產品情境都會影響解讀。\n【只聽最愛的人】還要理解接近目標客群、卻仍有障礙的人，不能只收集稱讚。\n【學生想深入了解】揭曉後的影片按鈕有創辦人完整演講與原站逐字稿，課後可以繼續看。", "wrap": "從這個案例帶走的，是先理解價值對誰最重要，再決定把資源放在哪裡。", "transition": "他們沒有把每個人的意見等量相加。我們整理成三個問題，下次遇到需求時也能用。", "pace": "本頁維持 4 分鐘，分三幕。方向鍵 → 逐幕展開，← 回看上一幕。先留 5 秒讓學生看原圖，再提問。原圖可點選放大；不要逐字翻譯英文介面。"}, "video": {"title": "Superhuman 創辦人親述：The Product-Market Fit Engine", "credit": "Business of Software · Rahul Vohra · BoS USA 2018 · 英語原音", "url": "https://businessofsoftware.org/talks/product-market-fit-engine/", "embed": "https://fast.wistia.net/embed/iframe/vabu1puq1h?autoPlay=false&videoFoam=true", "segment": "完整演講 56:58，建議課後延伸；課堂維持中文解說，不整段播放。", "before": "延伸觀看時，留意他如何從使用者的回應，決定產品優先服務誰。", "after": "調查已體驗產品的人，理解哪些人最依賴產品，以及他們重視的價值，再用這些資訊安排產品工作。這是一項決策工具，不能單靠調查分數保證成功。", "question": "如果你做履歷健檢，應該找還沒體驗的人，還是完成服務的人回答這種問題？", "access": "原站提供英文逐字稿。影片可能出現可略過的訂閱提示；可關閉播放器，依中文講稿繼續。中文重點為講者整理。"}, "revealScenes": [{"image": "rahul", "title": "做了兩年，\n他仍不確定夠不夠好。", "caption": "Rahul Vohra · Superhuman 創辦人\n已有測試使用者，卻還不敢全面推出。", "question": "如果你是他，要靠什麼判斷可以往前走？", "credit": "原始圖像：Rahul Vohra／First Round Review", "fit": "cover"}, {"image": "segments", "title": "「不能再用，\n你會多失望？」", "caption": "這次調查：22% 非常失望／52% 有點失望\n26% 不失望。這是當時的使用者回覆。", "question": "你會先找哪一群人聊？想知道什麼？", "credit": "原始圖像：Rahul Vohra／First Round Review"}, {"image": "words", "title": "看見大家想要的，\n也看見誰最需要。", "caption": "核心支持者反覆提到：速度、鍵盤、快捷鍵。\n先理解他們珍惜什麼，再聚焦改善方向。", "question": "如果把所有意見平均處理，會不會磨掉最有價值的特色？", "credit": "原始圖像：Rahul Vohra／First Round Review", "video": true}]}, {"title": "一個需求，\n先問三件事", "mins": 3, "question": "回到履歷健檢：急著投實習的人，和先收藏資訊的人，需要一樣嗎？", "script": {"opening": "現在把剛才的取捨整理成三個你們可以直接使用的問題。這是我整理給課堂練習的方法。", "explain": "第一，誰遇到？第二，不解決會怎樣？第三，有沒有真的發生？如果只知道有人想要一個功能，還不足以排出優先順序。", "ask": "回到履歷健檢。下週就要投實習的人，和先收藏資訊的人，會有一樣急迫的需求嗎？請各說一個他們可能卡住的地方。", "responses": "【只用年級分類】年級有幫助，但同一年級也有人明天要投履歷、有人半年後才打算找。\n【學生只猜】很好，這是我們的假設。接下來要找實際的人確認。", "wrap": "把對象、任務和後果放在一起，你的選擇才比較說得清楚。", "transition": "把這三個問題帶回剛剛的履歷健檢：所有學生都可能需要，但第一群人是誰？", "pace": "本頁 3 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "回到履歷健檢：\n你先幫哪一群人？", "mins": 3, "question": "你明天能去哪裡找到這群人？", "script": {"opening": "繼續用履歷健檢。請把所有大學生這個範圍縮小，選出你第一週真的找得到的一群人。", "explain": "你可以說：我們先幫下週要投第一份實習、卻沒有履歷初稿的人。這只是示例，你們可以選不同的人。重點是情境具體，能找到本人。", "ask": "給各組一分鐘填這句話，再請兩組分享。我會接著問：明天去哪裡找到他們？", "responses": "【說所有學生】先選十位你想優先接觸的人，他們有什麼共同處境？\n【找不到人】可以從系上實習群、職涯活動或自己的同學圈想，但要確認那裡真的有符合條件的人。", "wrap": "有了一群具體的人，我們更容易開始測試。不過，有人喜歡仍不代表整個產品能持續。", "transition": "找得到一群需要的人，是重要一步。但有人喜歡，整個產品就一定撐得下去嗎？第三個故事換成一個投入很多心力的遊戲團隊。", "pace": "本頁 3 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "你們做出的那個世界", "mins": 2, "question": "喜歡畫面，就代表你會長期玩、甚至付錢嗎？", "source": null, "script": {"opening": "第三個故事，換成一群做遊戲的人。他們已經投入很多心力，也真的有人喜歡。問題是，還要繼續投入嗎？", "explain": "這段是改編情境，並非歷史影像。看短片時，請想像你不只是旁觀者，你也是熬夜做出這個世界的人。\n【播放短片；需要時再開真實遊戲圖片】", "ask": "喜歡一個遊戲的畫面，和願意長期玩、甚至付錢，是同一回事嗎？你有沒有看過很漂亮，卻沒有繼續玩的遊戲？", "responses": "【說喜歡就繼續做】喜歡很重要，還要知道足不足以支撐後面的投入。\n【立刻喊出公司】先把名字留著，請回到當時還不知道結局的資訊。", "wrap": "接著看真實團隊當時手上有哪些線索。", "transition": "先停在這個困境。回到真實團隊當時的情況，看他們除了遊戲，手上還有哪些線索。", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "有人喜歡，\n卻撐不起營運", "mins": 2, "question": "你會先想怎麼救遊戲，還是還有什麼值得測試？", "source": "slack", "script": {"opening": "這是真實團隊面臨的兩件事：遊戲有喜歡它的玩家，但規模不足以支撐營運；團隊另有一個每天都在用的自製溝通工具。", "explain": "左邊是真實遊戲畫面。右邊的內部工具，是另一條線索。自己用得順，還不能直接推論其他團隊也需要；這一點請先記住。", "ask": "如果你今天加入團隊，你會先問遊戲的什麼事？又會問工具的什麼事？各收一個問題。", "responses": "【說工具一定有市場】你會找哪一種外部團隊試？他們現在怎麼處理溝通？\n【說遊戲有人喜歡不能停】要繼續，可以，但你需要知道再投入後可能改變什麼。", "wrap": "兩個方向都有不確定性。現在請你決定下一筆資源要往哪裡。", "transition": "遊戲有人喜歡，工具在內部有人用。這些都還有未知。如果下一筆資源由你決定，你投在哪裡？", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "下一筆資源，\n你投在哪裡？", "mins": 1, "question": "你最擔心選錯之後，會失去什麼？", "script": {"opening": "這次不是選你喜歡哪個產品，而是決定團隊下一筆時間和資源怎麼用。", "explain": "繼續遊戲、測試工具、結束專案，都有代價。先別用我們今天可能知道的結果倒推。只用剛剛給的資訊，做當時的決定。", "ask": "三十秒，選一個方向，再寫一句：我最怕失去的是什麼。", "responses": "【說已做很久所以不能停】我懂那個不甘心。如果你今天才接手，還會投同樣的資源嗎？\n【說停止就是失敗】停止也可能是資源選擇，但你要說出依據。", "wrap": "下一步，小組要為自己的選擇訂出能改變判斷的條件。", "transition": "不只選方向，還要知道何時改變。請小組寫出會讓你繼續或轉向的證據。", "pace": "本頁 1 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "什麼證據，\n會讓你改變決定？", "mins": 7, "timer": 240, "question": "如果你今天才接手，還會做同樣的決定嗎？", "script": {"opening": "請先寫我們目前選什麼，再補兩句：看到什麼就繼續，看到什麼就改變方向。", "explain": "不要只寫有成效或沒成效。讓一個不在你們組裡的人，也看得懂什麼結果會觸發下一個決定。條件要和你們的疑問有關。", "ask": "【四分鐘討論】兩組各分享一分鐘。我會用最後一分鐘追問：如果你今天才接手，還會做同樣決定嗎？", "responses": "【說再努力就會成功】努力是投入，不是結果。你要觀察哪個結果？\n【選工具】怎樣的外部行為，會讓你覺得值得再試？\n【沒有共識】先寫出各自最擔心的風險，看能否用一個小測試釐清。", "wrap": "先記住自己的條件。現在揭曉，但我們評估的不只最後有沒有成功。", "transition": "先保留你們的判斷條件。接著揭曉當事人的選擇，但別讓後來的結果取代當時的思考。", "pace": "本頁 7 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "揭曉：遊戲結束，\n工具成為 Slack", "mins": 4, "reveal": true, "source": "slack", "question": "如果新產品也失敗，當時的決策就一定沒道理嗎？", "script": {"opening": "剛才每一組都有自己的選擇。現在先不急著背答案，我們來看當事人留下的畫面。請先安靜看五秒，告訴我你看到什麼。", "explain": "[第 1 幕｜先別急著看成功。他們關掉了一個世界。]\n這是 Glitch 真實遊戲畫面。\n停止它，代表告別投入的心力與玩家。\n問大家：「如果是你親手做的作品，你捨得停下來嗎？」\n[收兩個回答，再按 → 前進。]\n\n[第 2 幕｜接下來，聽當事人親口說。]\nStewart Butterfield · Stanford 訪談\n83 秒：團隊裡的工具，怎麼慢慢變得重要？\n問大家：「請找出：他說了哪些團隊真的在做的事？」\n[收兩個回答，再按 → 前進。]\n\n[第 3 幕｜作品可以結束，學到的東西可以留下。]\n內部工具成了新的產品方向。\n但團隊自己需要，仍要再經過外部使用者驗證。\n問大家：「你聽到的是「突然想到好點子」，還是已經出現的使用行為？」\n[收兩個回答，再按 → 前進。]\n\n【先按揭曉，再開影片】我們今天很容易因為知道 Slack，覺得轉向很明顯。但當時的人還不知道結果，也要面對人員、玩家和先前承諾的代價。成功的後續，不能抹掉決策當下的不確定。\n\n【看片前直接說】看影片時只抓一件事：這個工具先替他們解決了什麼具體麻煩？\n【播放 31:40–33:03，約 83 秒；結束關閉播放器】\n【看片後直接說】原本的聊天工具會漏掉離線訊息。他們逐步加入紀錄、搜尋與整合，工具成為團隊工作的一部分，才想到其他團隊可能也需要。這仍然需要外部測試。", "ask": "假設這個工具後來也沒有成功，當時的決定就一定不合理嗎？先請一位同學說理由，再請另一位補充。", "responses": "【說成功才算對】結果當然重要，但做決定時只能用當時取得的資訊。我們也要看投入有沒有上限、是否願意隨證據修正。\n【說應該一律轉型】換方向也要重新測試，不是換名字就有市場。\n【影片無法播放】我們改用中文整理：原本的聊天工具會漏掉離線訊息。他們逐步加入紀錄、搜尋與整合，工具成為團隊工作的一部分，才想到其他團隊可能也需要。這仍然需要外部測試。", "wrap": "這個故事讓我們練習的，是在投入很多之後，仍能重新判斷下一步。", "transition": "知道結果之後，回到當時：如果決定再試一個方向，怎麼避免無限投入？", "pace": "本頁維持 4 分鐘，分三幕。方向鍵 → 逐幕展開，← 回看上一幕。先留 5 秒讓學生看原圖，再提問。第二幕影片約 83 秒，包含在本頁時間內。"}, "video": {"title": "Slack 創辦人親述：內部工具如何成為新方向", "credit": "Stanford Graduate School of Business · 2020 · 英語原音", "url": "https://www.youtube.com/watch?v=EhxX06-LsZs&t=1900s", "embed": "https://www.youtube-nocookie.com/embed/EhxX06-LsZs?start=1900&end=1983&rel=0&cc_load_policy=1&autoplay=0", "segment": "課堂精選 31:40–33:03，約 83 秒；內嵌播放到片段結尾停止。", "before": "看影片時只抓一件事：這個工具先替他們解決了什麼具體麻煩？", "after": "原本的聊天工具會漏掉離線訊息。他們逐步加入紀錄、搜尋與整合，工具成為團隊工作的一部分，才想到其他團隊可能也需要。這仍然需要外部測試。", "question": "內部每天都在用，和外部團隊願意採用，中間還缺哪個證據？", "access": "英語原音，播放器可選字幕；中文字幕依平台提供情況而定。右側中文重點為講者整理，不是逐字翻譯。"}, "revealScenes": [{"image": "slack", "title": "先別急著看成功。\n他們關掉了一個世界。", "caption": "這是 Glitch 真實遊戲畫面。\n停止它，代表告別投入的心力與玩家。", "question": "如果是你親手做的作品，你捨得停下來嗎？", "credit": "Glitch 真實遊戲圖片／Building Slack", "fit": "cover"}, {"image": "slack", "title": "接下來，\n聽當事人親口說。", "caption": "Stewart Butterfield · Stanford 訪談\n83 秒：團隊裡的工具，怎麼慢慢變得重要？", "question": "請找出：他說了哪些團隊真的在做的事？", "credit": "Glitch 真實遊戲圖片／Building Slack", "video": true, "videoLabel": "播放創辦人親述 · 83 秒"}, {"image": "glitch_end", "title": "作品可以結束，\n學到的東西可以留下。", "caption": "內部工具成了新的產品方向。\n但團隊自己需要，仍要再經過外部使用者驗證。", "question": "你聽到的是「突然想到好點子」，還是已經出現的使用行為？", "credit": "Glitch 真實遊戲圖片／Building Slack"}]}, {"title": "再試一次，\n要先約定什麼？", "mins": 3, "question": "如果結果不好，你能接受換方法、換客群，或停止嗎？", "script": {"opening": "如果團隊決定再試一次，試之前最好先講清楚四件事。這是我們從案例整理出的行動方法。", "explain": "要確認什麼，最多投入多少，何時回來檢查，以及看到什麼就繼續、調整或停止。這樣下一次開會，才不會只剩再努力兩週。", "ask": "假設你們要測外部團隊是否需要溝通工具，請幫我補一句：我們這兩週最想確認什麼？", "responses": "【列一長串目標】先選最可能讓你改變決定的一個。\n【不想設停止條件】不一定要立刻放棄，但要承認什麼結果代表原方法需要改變。", "wrap": "這四件事，等一下會直接寫進你們自己的實驗卡。", "transition": "用這四個約定，再看我們的履歷健檢。如果推了一陣子還沒人預約，下一步該測什麼？", "pace": "本頁 3 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "履歷健檢推了一陣子，\n卻沒有人預約", "mins": 3, "question": "是沒人知道、找錯對象，還是不需要？你怎麼分辨？", "script": {"opening": "回到我們一路練習的履歷健檢。假設推了一陣子，卻沒人預約。夥伴提議再加模擬面試，你會立刻答應嗎？", "explain": "同一個沒人預約，可能是沒人知道、找錯人、預約太麻煩，或問題沒那麼重要。原因不同，適合的下一步也不同。", "ask": "先選一個你最想排查的原因，說一個能分辨它的動作。我們不急著決定增加功能或放棄。", "responses": "【說加服務總是比較好】也可能增加交付成本，卻沒解決預約的障礙。你想先證明哪一件事？\n【說沒人要就停】先確認符合條件的人真的看過、理解過服務嗎？\n【沉默】如果根本沒人看到，改履歷內容有用嗎？", "wrap": "先找出最關鍵的未知，再決定做哪個實驗。", "transition": "同樣是沒人預約，原因可能不同。不要一次改全部。接下來只挑一個最重要的疑問，用七天取得證據。", "pace": "本頁 3 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "七天後，\n你想知道什麼？", "mins": 2, "question": "最沒把握的是有人需要、找得到人，還是願意付出？", "script": {"opening": "現在輪到你們。可以沿用履歷健檢，也可以用自己的點子，但七天內只挑一個問題。", "explain": "你最沒把握的是有人需要、找得到對象，還是對方願意付出時間或金錢？先選一個。今天不需要把整間公司規劃完。", "ask": "各組用一分鐘決定：七天後最想知道哪件事？再用一句話告訴旁邊的人。", "responses": "【目標是做完整 App】做完是產出。你做完它，是想知道誰會做什麼？能不能用更小的方式先知道？\n【沒有點子】就用履歷健檢，選下週要投實習的人。", "wrap": "問題越清楚，下一頁的實驗卡就越容易填。", "transition": "選好問題後，把對象、動作、觀察方式和投入上限一起寫下來。", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "我們的\n七天實驗卡", "mins": 5, "timer": 300, "question": "七天後，你要拿出什麼紀錄，讓別人看懂結果？", "script": {"opening": "現在把想法寫成一張別人看得懂、下週做得出來的實驗卡。請先寫對象和最不確定的事。", "explain": "接著寫七天內做什麼、看什麼行為、最多花多少資源，以及怎麼決定下一步。結果不一定要好看，但要有紀錄，能幫你判斷。", "ask": "【啟動五分鐘倒數】前一分鐘寫對象和問題，中間三分鐘設計動作與觀察，最後一分鐘補上投入上限和判斷條件。請每組一人記錄，其他人挑漏洞。", "responses": "【巡組看到看看反應】把反應改成能數或能記錄的事，例如符合條件的人是否完成預約。\n【只寫成功門檻】如果沒達到，你準備查原因、改方法，還是停止？\n【畫面填寫提醒】投影欄位只存講者這台瀏覽器，同學請用紙或自己的文件。", "wrap": "等一下分享不用漂亮簡報，只要讓大家知道你們下一週會做什麼。", "transition": "現在把實驗卡當作講稿，請兩組各用 90 秒，讓我們聽懂下週具體要做什麼。", "pace": "本頁 5 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "90 秒，\n說明你怎麼測試", "mins": 3, "timer": 90, "question": "聽完後，你知道他們下一週具體要做什麼嗎？", "script": {"opening": "請兩組各用九十秒分享。照這四句說就好：對象、疑問、動作、怎麼決定。", "explain": "聽的人也有任務：先不要評點子酷不酷，聽完後確認你是否知道他們要找誰、做什麼、留下什麼紀錄。", "ask": "【第一組開始倒數；第二組先按重設】時間到我會請你用一句話收尾：你們看到什麼會改變做法？", "responses": "【講太多背景】我先幫你停一下，直接告訴我們下週第一個動作。\n【現場沒人自願】請一組沿用履歷健檢、一組用自己點子的分享，不用準備得完美。", "wrap": "謝謝兩組。接下來用同一套問題，幫這兩個實驗變得更清楚。", "transition": "剛剛聽到了兩個計畫。用三個問題檢查：它真的能回答原本的疑問嗎？", "pace": "本頁 3 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "這個實驗，\n真的回答了問題嗎？", "mins": 2, "question": "什麼結果，會讓你承認原本的想法可能不對？", "script": {"opening": "我們不是替兩組打分數，而是檢查實驗和問題有沒有對上。", "explain": "找的人符合對象嗎？觀察的行為回答問題嗎？結果出來後，知道下一步怎麼決定嗎？請各組也一起檢查自己的卡。", "ask": "剛才兩組裡，有哪一組可以改得更具體？請指出一句原本的寫法，再試著重寫。", "responses": "【只給稱讚】謝謝，再幫他補一個能提高判斷力的建議。\n【拿小樣本當市場證明】小測試可以支持下一步，但不代表整個市場都一樣。\n【沒有建議】如果要測預約，只有問喜不喜歡，還缺了哪一步？", "wrap": "把其中一個改善寫回自己的卡。現在回到我們最開始的選擇。", "transition": "你們已經練過找證據、選對象和設定判斷條件。現在回到最初那件 T-shirt，同樣資訊下，你的理由有沒有變？", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "回到開場：\n你還會選一樣的嗎？", "mins": 2, "question": "現在你會先補哪項資訊？為什麼會影響決定？", "script": {"opening": "還記得那件 T-shirt 嗎？同樣是一百人喊＋1、二十人填尺寸、三人付款，數據完全沒變。", "explain": "現在請你再選一次，也看看開場寫的理由。不換選項不代表沒學到，換了也不自動比較好。我更在意你現在知道還缺什麼資訊。", "ask": "給大家三十秒，再請一位改變選擇、一位維持選擇的同學分享。請講理由，不只講選項。", "responses": "【大家都選同一個】那我們比較各自要問的問題，可能仍然不一樣。\n【有人問正解】現有資訊仍不足以宣告唯一答案。你能說清楚要補什麼證據，才是今天練習的重點。", "wrap": "你不需要每次一開始就知道答案，但可以把下一步變得更有依據。", "transition": "答案可以相同，理由可以更清楚。最後，把這個判斷方式，變成你明天真的會做的一個動作。", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "明天，\n你的第一個動作", "mins": 2, "question": "你明天就能做的第一個動作是什麼？", "script": {"opening": "最後，請把今天的想法縮成你明天會做的一個動作。不是總有一天，而是明天。", "explain": "寫下我會找誰、做什麼、確認什麼。越具體越好，最好具體到你知道第一則訊息要傳給誰。", "ask": "三十秒寫完，再請一兩位同學讀出來。聽到太大的計畫時，我會請你縮成第一步。", "responses": "【說開始創業】先縮小，明天第一個能完成的動作是什麼？\n【說找朋友聊聊】找哪一類朋友？想問哪段真實經驗？\n【擔心結果不好】結果不好也有資訊，記得回到你原本想確認的問題。", "wrap": "把這句話帶回去。接下來我們用 Q&A，處理你做這一步之前還卡住的地方。", "transition": "把這個第一步留著。接下來的 Q&A，就從你還不知道怎麼做、或最怕判斷錯的地方開始。", "pace": "本頁 2 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}, {"title": "把你的點子拿上來，\n我們一起拆", "mins": 30, "question": "現在最缺哪個資訊？最快可以怎麼取得？", "script": {"opening": "現在把問題帶上來。不一定要有完整創業點子，你有一個正在猶豫的決定就可以。", "explain": "先用三句介紹：想幫誰、試過什麼、卡在哪裡。這樣我們才能一起判斷，現在是缺對象、缺證據，還是缺明確的下一步。", "ask": "前五分鐘先處理共通疑問，中間二十分鐘討論三到四個學生情境，最後五分鐘短問短答。每位先用三十秒說背景，我會用問題幫你縮小範圍。", "responses": "【沒人提問】可以從剛才的實驗卡開始：哪一欄最難填？\n【問我會不會成功】我沒辦法從一個點子保證結果。我們可以一起找出最值得先確認的事。\n【問題很大】如果只能在七天內取得一項資訊，你最想知道什麼？\n【時間到還有問題】請先記下缺的證據，今天先把能開始做的第一步說清楚。", "wrap": "謝謝大家。希望你帶走的不只是三個公司的故事，而是面對下一個不確定的決定時，知道怎麼找人、看行為、再決定。", "transition": "收尾時請大家回看自己的第一步：今天還沒答案的問題，下一步可以向誰取得什麼證據？", "pace": "本頁 30 分鐘，含等待、互動與操作；不需把所有備用回應都念完。"}}], "sources": {"buffer": ["Buffer 創辦人回顧", "https://buffer.com/resources/idea-to-paying-customers-in-7-weeks-how-we-did-it/"], "superhuman": ["Superhuman 創辦人回顧", "https://review.firstround.com/how-superhuman-built-an-engine-to-find-product-market-fit/"], "slack": ["Johnny Rodgers：The death of Glitch, the birth of Slack", "https://buildingslack.com/the-death-of-glitch-the-birth-of-slack/"]}};let index=Math.max(0,Math.min(31,(parseInt(location.hash.slice(1))||1)-1)),shown=false,sceneStep=0,linked=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#pages').innerHTML=D.slides.map((s,i)=>`<option value="${i}">${i+1}. ${esc(s.title.replace(/\n/g,''))}</option>`).join('');
function render(){let s=D.slides[index],elapsed=D.slides.slice(0,index).reduce((n,s)=>n+s.mins,0);$('#title').textContent=s.title.replace(/\n/g,'');$('#pages').value=index;$('#timing').textContent=`本頁建議 ${s.mins} 分鐘 · 課程安排 ${elapsed}–${elapsed+s.mins} 分鐘`;if(s.revealScenes&&linked)$('#timing').textContent+=' · '+(shown?'目前第 '+(sceneStep+1)+' 幕／'+s.revealScenes.length+' 幕':'尚未揭曉');$('#script').innerHTML=[['pace','控時提醒'],['opening','開場：直接說'],['explain','主講：直接說'],['ask','引導學生'],['responses','依現場回答選用'],['wrap','收束：直接說'],['transition','接到下一頁']].map(([k,label])=>`<section class="${k}"><h2>${label}</h2><p>${esc(s.script[k])}</p></section>`).join('');$('#question').textContent=s.question;$('#prev').disabled=index===0;$('#next').disabled=index===31;$('#next').textContent=s.reveal&&!shown&&linked?'揭曉真實做法 →':s.revealScenes&&linked&&sceneStep<s.revealScenes.length-1?'下一幕 →':'下一步 →';$('#toggle').disabled=$('#reset').disabled=!linked||!s.timer;$('#timer').textContent=s.timer?format(s.timer):'—';let links=[];if(s.source){let a=D.sources[s.source];links.push(`<a target="_blank" rel="noopener" href="${esc(a[1])}">${esc(a[0])}</a>`);}if(s.video){links.push(`<p>${esc(s.video.segment)}</p><a target="_blank" rel="noopener" href="${esc(s.video.url)}">${esc(s.video.title)}</a>`);}$('#sources').innerHTML=links.join('<br>')||'本頁為教學整理或課堂模擬。';$('#nextTitle').textContent=D.slides[index+1]?.title.replace(/\n/g,'')||'課程結束';history.replaceState(null,'','#'+(index+1));}
function format(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function send(action,i){if(linked&&window.opener){window.opener.postMessage({type:'presenter-command',action,index:i},location.origin==='null'?'*':location.origin);}else if(action==='next'){index=Math.min(31,index+1);render();window.scrollTo(0,0);}else if(action==='prev'){index=Math.max(0,index-1);render();window.scrollTo(0,0);}else if(action==='go'){index=i;render();window.scrollTo(0,0);}}
window.addEventListener('message',e=>{if(e.source!==window.opener)return;if(location.origin!=='null'&&e.origin!==location.origin)return;let m=e.data;if(m?.type==='presenter-state'){let changed=index!==m.index;index=m.index;shown=m.revealed;sceneStep=m.revealStep||0;linked=true;$('#status').textContent='已連線主簡報 · 翻頁與揭曉會同步';render();if(changed)window.scrollTo(0,0);}if(m?.type==='presenter-timer')$('#timer').textContent=m.enabled?format(m.seconds):'—';});
$('#pages').onchange=e=>send('go',+e.target.value);$('#prev').onclick=()=>send('prev');$('#next').onclick=()=>send('next');$('#toggle').onclick=()=>send('toggle');$('#reset').onclick=()=>send('reset');for(const [id,delta]of [['smaller',-2],['larger',2]])$('#'+id).onclick=()=>{$('#script').style.fontSize=Math.max(16,Math.min(36,parseFloat(getComputedStyle($('#script')).fontSize)+delta))+'px';};render();if(window.opener)window.opener.postMessage({type:'presenter-ready'},location.origin==='null'?'*':location.origin);
